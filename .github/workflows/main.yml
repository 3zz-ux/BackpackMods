name: Build Fabric Mod 26.2

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Auto-Patch and Build Mod
        run: |
          echo "=== 1. تصحيح build.gradle لاستخدام modImplementation ==="
          sed -i 's/implementation "net.fabricmc.fabric-api:fabric-api/modImplementation "net.fabricmc.fabric-api:fabric-api/g' build.gradle
          sed -i 's/implementation "net.fabricmc:fabric-loader/modImplementation "net.fabricmc:fabric-loader/g' build.gradle

          echo "=== 2. فحص وتصحيح كود الجافا تلقائياً ==="
          python3 -c "
          import os, re

          # تصحيح دالة الواجهة والصلاحيات
          screen_file = 'src/main/java/com/backpackmod/client/BackpackScreen.java'
          if os.path.exists(screen_file):
              with open(screen_file, 'r') as f:
                  txt = f.read()
              txt = txt.replace('protected void extractBackground', 'public void extractBackground')
              # تعطيل المتغيرات الثابتة إذا كانت تسبب خطأ final
              txt = re.sub(r'(this\.imageWidth\s*=\s*[^;]+;)', r'// \1', txt)
              txt = re.sub(r'(this\.imageHeight\s*=\s*[^;]+;)', r'// \1', txt)
              with open(screen_file, 'w') as f:
                  f.write(txt)
              print('Patched BackpackScreen.java')

          # تصحيح تاقات كرات الـ XP
          mod_file = 'src/main/java/com/backpackmod/BackpackMod.java'
          if os.path.exists(mod_file):
              with open(mod_file, 'r') as f:
                  txt = f.read()
              txt = txt.replace('orb.getTags()', 'orb.getScoreboardTags()')
              with open(mod_file, 'w') as f:
                  f.write(txt)
              print('Patched BackpackMod.java')

          # تعطيل أيقونة الخلفية مؤقتاً لتفادي خطأ setBackground
          slot_file = 'src/main/java/com/backpackmod/BackpackSlot.java'
          if os.path.exists(slot_file):
              with open(slot_file, 'r') as f:
                  txt = f.read()
              txt = re.sub(r'(setBackground\([^)]+\);)', r'// \1', txt)
              with open(slot_file, 'w') as f:
                  f.write(txt)
              print('Patched BackpackSlot.java')
          "

          echo "=== 3. تشغيل البيلد ==="
          gradle build --stacktrace

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: BackpackMod-26.2
          path: |
            build/libs/*.jar
            **/build/libs/*.jar
