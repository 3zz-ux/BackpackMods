name: Build Minecraft 26.2 Mod

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Prepare and Build Mod
        run: |
          set -e
          echo "=== 1. البحث عن مسار المشروع ==="
          BUILD_FILE=$(find . -name "build.gradle" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "لم يتم العثور على ملف build.gradle!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "تم العثور على المشروع في: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          echo "=== 2. تصحيح إعدادات Gradle وإضافة موديولات Fabric API ==="
          if [ -f "gradle.properties" ]; then
            sed -i 's/loom_version=.*/loom_version=1.17.21/g' gradle.properties
          fi

          python3 -c "
          with open('settings.gradle', 'w', encoding='utf-8') as f:
              f.write('''pluginManagement {
              repositories {
                  maven { url = \"https://maven.fabricmc.net/\" }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  maven { url = \"https://maven.fabricmc.net/\" }
                  mavenCentral()
              }
          }
          ''')
          "

          python3 -c "
          with open('build.gradle', 'r', encoding='utf-8') as f:
              bg = f.read()

          repo_block = '\nrepositories {\n    maven { url = \"https://maven.fabricmc.net/\" }\n    mavenCentral()\n}\n'
          if 'https://maven.fabricmc.net/' not in bg:
              if 'base {' in bg:
                  idx = bg.find('base {')
                  end_idx = bg.find('}', idx) + 1
                  bg = bg[:end_idx] + repo_block + bg[end_idx:]
              else:
                  bg = bg + repo_block

          # إضافة موديولات Fabric API الصريحة للـ classpath
          submodules = '''
              implementation \"net.fabricmc.fabric-api:fabric-screen-handler-api-v1:${project.fabric_version}\"
              implementation \"net.fabricmc.fabric-api:fabric-item-group-api-v1:${project.fabric_version}\"
              implementation \"net.fabricmc.fabric-api:fabric-rendering-v1:${project.fabric_version}\"
              implementation \"net.fabricmc.fabric-api:fabric-lifecycle-events-v1:${project.fabric_version}\"
              implementation \"net.fabricmc.fabric-api:fabric-networking-api-v1:${project.fabric_version}\"
              implementation \"net.fabricmc.fabric-api:fabric-data-attachment-api-v1:${project.fabric_version}\"
              implementation \"net.fabricmc.fabric-api:fabric-key-binding-api-v1:${project.fabric_version}\"
          '''
          if 'fabric-screen-handler-api-v1' not in bg:
              bg = bg.replace('implementation \"net.fabricmc.fabric-api:fabric-api:${project.fabric_version}\"',
                              'implementation \"net.fabricmc.fabric-api:fabric-api:${project.fabric_version}\"' + submodules)

          with open('build.gradle', 'w', encoding='utf-8') as f:
              f.write(bg)
          "

          echo "=== 3. فحص وتصحيح الكود تلقائياً لنسخة 26.2 ==="
          find src -type f -name "*.java" -exec sed -i 's/net\.minecraft\.world\.inventory\.ClickType/net\.minecraft\.world\.inventory\.ContainerInput/g' {} +
          find src -type f -name "*.java" -exec sed -i 's/ClickType /ContainerInput /g' {} +
          find src -type f -name "*.java" -exec sed -i 's/ClickType\./ContainerInput\./g' {} +
          find src -type f -name "BackpackSlot.java" -exec sed -i 's/setBackground/\/\/ setBackground/g' {} +
          find src -type f -name "BackpackModel.java" -exec sed -i 's/import net\.minecraft\.client\.renderer\.RenderType;/import net\.minecraft\.client\.renderer\.rendertype\.RenderType;/g' {} +

          python3 -c '
          import os
          for root, dirs, files in os.walk("src"):
              for f in files:
                  p = os.path.join(root, f)
                  if f == "BackpackScreen.java":
                      with open(p, "r", encoding="utf-8") as fp:
                          c = fp.read()
                      c = c.replace("this.imageWidth = BackpackMenu.width(menu.tier());", "// this.imageWidth")
                      c = c.replace("this.imageHeight = BackpackMenu.height(menu.tier());", "// this.imageHeight")
                      c = c.replace("protected void extractBackground", "public void extractBackground")
                      c = c.replace("w = imageWidth, h = imageHeight;", "w = BackpackMenu.width(menu.tier()), h = BackpackMenu.height(menu.tier());")
                      with open(p, "w", encoding="utf-8") as fp:
                          fp.write(c)
                      print("Patched BackpackScreen")

                  elif f == "BackpackLogic.java":
                      with open(p, "r", encoding="utf-8") as fp:
                          c = fp.read()
                      c = c.replace("import net.minecraft.world.level.GameRules;", "")
                      lines = c.splitlines()
                      lines = [l for l in lines if "getGameRules" not in l]
                      c = "\n".join(lines)
                      with open(p, "w", encoding="utf-8") as fp:
                          fp.write(c)
                      print("Patched BackpackLogic")

                  elif f == "BackpackMod.java":
                      with open(p, "r", encoding="utf-8") as fp:
                          c = fp.read()
                      c = c.replace("PayloadTypeRegistry.playC2S()", "PayloadTypeRegistry.serverboundPlay()")
                      if "!orb.getTags().contains" in c:
                          c = c.replace("private static final String XP_TAG = \"backpackmod_x6\";", "private static final java.util.Set<java.util.UUID> MULTIPLIED_ORBS = java.util.Collections.synchronizedSet(new java.util.HashSet<>());")
                          c = c.replace("!orb.getTags().contains(XP_TAG)", "MULTIPLIED_ORBS.add(orb.getUUID())")
                          c = c.replace("orb.addTag(XP_TAG);", "")
                      with open(p, "w", encoding="utf-8") as fp:
                          fp.write(c)
                      print("Patched BackpackMod")

                  elif f == "ModRegistry.java":
                      with open(p, "r", encoding="utf-8") as fp:
                          c = fp.read()
                      c = c.replace("new net.minecraft.world.item.crafting.SimpleCraftingRecipeSerializer<>(UpgradeRecipe::new)", "new CustomRecipe.Serializer<>(UpgradeRecipe::new)")
                      with open(p, "w", encoding="utf-8") as fp:
                          fp.write(c)
                      print("Patched ModRegistry")

                  elif f == "UpgradeRecipe.java":
                      with open(p, "r", encoding="utf-8") as fp:
                          c = fp.read()
                      c = c.replace("public UpgradeRecipe(net.minecraft.world.item.crafting.CraftingBookCategory category) { super(category); }", "")
                      c = c.replace("public UpgradeRecipe(CraftingBookCategory category) { super(category); }", "")
                      with open(p, "w", encoding="utf-8") as fp:
                          fp.write(c)
                      print("Patched UpgradeRecipe")
          '

          echo "=== 4. بدء عملية البيلد ==="
          gradle build --stacktrace

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: BackpackMod-26.2
          path: '**/build/libs/*.jar'
