name: Build Fabric Mod 26.2

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Auto-Fix 26.2 Code and Build
        run: |
          echo "=== 1. تصحيح مسميات كود الجافا لنسخة 26.2 ==="
          python3 -c "
          import os, re

          for root, _, files in os.walk('src'):
              for f in files:
                  if f.endswith('.java'):
                      p = os.path.join(root, f)
                      with open(p, 'r', encoding='utf-8') as file:
                          code = file.read()
                      orig = code

                      # 1. تغيير ClickType القديم إلى الاسم الجديد الرسمي ContainerInput
                      code = code.replace('import net.minecraft.world.inventory.ClickType;', 'import net.minecraft.world.inventory.ContainerInput;')
                      code = code.replace('ClickType', 'ContainerInput')

                      # 2. تصحيح GameRules لقواعد اللعبة في 26.2
                      code = code.replace('getGameRules().get(GameRules.KEEP_INVENTORY)', 'getGameRules().getBoolean(GameRules.RULE_KEEPINVENTORY)')
                      code = code.replace('GameRules.KEEP_INVENTORY', 'GameRules.RULE_KEEPINVENTORY')

                      # 3. تصحيح واجهة الشنطة BackpackScreen
                      code = code.replace('protected void extractBackground', 'public void extractBackground')
                      code = re.sub(r'(this\.imageWidth\s*=\s*[^;]+;)', r'// \1', code)
                      code = re.sub(r'(this\.imageHeight\s*=\s*[^;]+;)', r'// \1', code)

                      # 4. تصحيح تاقات كرات الـ XP
                      code = code.replace('orb.getTags()', 'orb.getScoreboardTags()')

                      # 5. تصحيح مسجّل وصفة الترقية
                      code = code.replace('new CustomRecipe.Serializer<>(UpgradeRecipe::new)', 'new net.minecraft.world.item.crafting.SimpleCraftingRecipeSerializer<>(UpgradeRecipe::new)')

                      # 6. تعطيل دالة الأيقونة مؤقتاً لتفادي خطأ الميثود
                      code = re.sub(r'(setBackground\([^)]+\);)', r'// \1', code)

                      if code != orig:
                          with open(p, 'w', encoding='utf-8') as file:
                              file.write(code)
                          print(f'تم تعديل: {f}')
          "

          echo "=== 2. تشغيل البيلد ==="
          gradle build --stacktrace

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: BackpackMod-26.2
          path: |
            build/libs/*.jar
            **/build/libs/*.jar
